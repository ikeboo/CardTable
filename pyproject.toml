[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cardtable"
version = "0.1.0"
description = "A small event-driven framework for connecting triggers, services, and widgets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "croniter>=6,<7",
    "customtkinter>=5.2.2,<6",
    "fastapi>=0.115,<1",
    "jsonrpcserver>=5.0.9,<6",
    "markdown-it-py>=3,<5",
    "numpy",
    "opencv-python",
    "pillow>=10,<13",
    "pydantic>=2.7,<3",
    "pygments>=2.17,<3",
    "pynput",
    "requests",
    "ruamel.yaml>=0.18.6,<0.19",
    "tkinterdnd2>=0.6.2",
    "tzlocal>=5,<6",
    "typing-extensions>=4.2,<5",
    "uvicorn>=0.30,<1",
    "watchdog>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["cardtable"]

[tool.hatch.build.targets.sdist]
include = ["cardtable", "examples", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "onnxruntime==1.23.2; python_version < '3.11'",
    "onnxruntime==1.25.0; python_version >= '3.11'",
    "ruff>=0.14,<1",
]
